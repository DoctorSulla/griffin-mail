<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<title>Griffin Mail</title>
	<defs>
		<linearGradient id="background" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
			<stop stop-color="#2563eb"/>
			<stop offset="1" stop-color="#172554"/>
		</linearGradient>
		<linearGradient id="gold" x1="34" y1="13" x2="50" y2="36" gradientUnits="userSpaceOnUse">
			<stop stop-color="#fde68a"/>
			<stop offset="1" stop-color="#f59e0b"/>
		</linearGradient>
	</defs>

	<rect x="2" y="2" width="60" height="60" rx="15" fill="url(#background)"/>

	<!-- The swept wing doubles as an open envelope. -->
	<path
		d="M12 45.5V27.8l19.4 13.5a4.5 4.5 0 0 0 5.2 0L49 32.6v12.9a4.5 4.5 0 0 1-4.5 4.5h-28a4.5 4.5 0 0 1-4.5-4.5Z"
		fill="#eff6ff"
	/>
	<path
		d="M13.2 26.1c5.5-7.1 13.5-10.3 24.1-9.5-5.1 2.2-9.2 5.1-12.2 8.7 5.8-2.4 11.1-2.7 15.9-1-5.8 1.7-10.3 4.2-13.5 7.6 4.5-1.4 8.5-1.3 12 .2l-7.7 6.1Z"
		fill="#fff"
	/>
	<path d="m13.8 47.9 12.8-10.6M47.6 47.9 38.4 40" fill="none" stroke="#bfdbfe" stroke-width="2.2" stroke-linecap="round"/>

	<!-- Eagle head and beak complete the griffin silhouette. -->
	<path
		d="M34.1 34.8c2.4-3.2 3.5-6.5 3.3-9.9l-2.6-3.7 4.5.7-.3-5 3.7 3.4 2-5.4 1.6 6.3c2.8.7 4.8 2.4 5.9 5l-4.4.8c-.7 3.7-3.1 6-7.1 6.9l-4.1 4.4Z"
		fill="url(#gold)"
	/>
	<path d="m51.8 26.2 5.2 2.4-6.2 2.1-3-3.7Z" fill="#fbbf24"/>
	<circle cx="45.5" cy="24.8" r="1.35" fill="#172554"/>
</svg>
